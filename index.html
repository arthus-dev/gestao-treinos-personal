<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Personal System</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="auth-container">

        <!-- FORMULÁRIO DE CADASTRO -->
        <div id="box-cadastro" class="auth-box">
            <h1 class="logo-sistema">🏋️‍♂️ Gestão de Treinos</h1>
            <h2>Criar Conta de Personal</h2>
            <p>Cadastre-se para gerenciar seus alunos e treinos</p>

            <form id="cadastroPersonal">
                <div class="input-group">
                    <label for="cad-nome">Nome Completo</label>
                    <input type="text" id="cad-nome" placeholder="Digite seu nome" required>
                </div>

                <div class="input-group">
                    <label for="cad-email">E-mail</label>
                    <input type="email" id="cad-email" placeholder="seu@email.com" required>
                </div>

                <div class="input-group">
                    <label for="cad-senha">Senha</label>
                    <input type="password" id="cad-senha" placeholder="Crie uma senha" required>
                </div>

                <button type="submit" class="btn-auth">Cadastrar</button>
            </form>

            <p class="auth-footer">
                Já tem conta? <a href="#" id="ir-para-login">Faça Login</a>
            </p>
        </div>

        <!-- FORMULÁRIO DE LOGIN -->
        <div id="box-login" class="auth-box hide">
            <h1 class="logo-sistema">🏋️‍♂️ Gestão de Treinos</h1>
            <h2>Login do Personal</h2>
            <p>Acesse seu painel de controle</p>

            <form id="loginPersonal">
                <div class="input-group">
                    <label for="login-email">E-mail</label>
                    <input type="email" id="login-email" placeholder="seu@email.com" required>
                </div>

                <div class="input-group">
                    <label for="login-senha">Senha</label>
                    <input type="password" id="login-senha" placeholder="Digite sua senha" required>
                </div>

                <button type="submit" class="btn-auth">Entrar</button>
            </form>

            <p class="auth-footer">
                Não tem conta? <a href="#" id="ir-para-cadastro">Cadastrar-se grátis</a>
            </p>
        </div>

    </div>

    <script src="script.js"></script>
</body>

</html>
